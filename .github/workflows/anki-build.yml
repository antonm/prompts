name: Anki Deck Build

on:
  push:
    branches:
      - main
      - price-watcher
    paths:
      - "anki/**"
      - ".github/workflows/anki-build.yml"
  pull_request:
    paths:
      - "anki/**"
      - ".github/workflows/anki-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anki/requirements.txt

      - name: Install build dependencies
        run: python3 -m pip install --no-cache-dir -r anki/requirements.txt

      - name: Run unit tests
        run: python3 -m unittest discover -s anki/tests -v

      - name: Validate, deduplicate, and build .apkg
        run: |
          python3 anki/build_apkg.py \
            --input anki/inbox.tsv \
            --output dist/antonm-anki.apkg \
            --clean-tsv dist/antonm-anki.tsv \
            --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload Anki artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antonm-anki
          path: |
            dist/antonm-anki.apkg
            dist/antonm-anki.tsv
          retention-days: 90

  publish-release:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built .apkg artifact
        uses: actions/download-artifact@v4
        with:
          name: antonm-anki
          path: dist

      - name: Update rolling anki-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          TAG="anki-latest"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/antonm-anki.apkg dist/antonm-anki.tsv \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" dist/antonm-anki.apkg dist/antonm-anki.tsv \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "Anki Inbox (Latest)" \
              --notes "Automatically built from anki/inbox.tsv with stable note GUIDs. Tap antonm-anki.apkg on AnkiDroid to import/update in place."
          fi
